# 在 GitHub Actions 里构建镜像并推到 ghcr.io
#
# 为什么放 CI 而不是本地推：
#   - 用 workflow 自带的 GITHUB_TOKEN（下面 permissions 里给了 packages: write），
#     不需要任何 PAT —— 也就不存在把 token 交给谁、写进命令行的问题
#   - 部署机拉到的镜像，来源可追溯到具体 commit（Actions 构建记录 + sha 标签）
#
# 标签规则：
#   main 分支        → latest
#   推 v0.3 这样的 tag → v0.3（部署机用 TAG=v0.3 拉）
#   每次构建          → sha-<短哈希>（精确回溯到某个提交）
#
# 首次推完后去确认包可见性（默认为 private，部署机免登录拉需要改 public）：
#   https://github.com/users/yeeqen00111/packages/container/hermes-web-console/settings

name: publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:        # 也可以在 Actions 页面手动点一次

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # 读代码
      packages: write       # 推 ghcr —— 关键，靠它免 PAT
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存：没有它每次都要重跑 npm ci + pip install
          cache-from: type=gha
          cache-to: type=gha,mode=max
